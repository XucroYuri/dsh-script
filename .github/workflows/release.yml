name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform-install:
    name: Release tarball gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:audit
      - run: npm install --global @deepseek-ai/dsh@0.1.0-rc.7
      - run: pnpm test:package-install
        env:
          NOVEL_STUDIO_TEST_TMP: ${{ runner.temp }}/novel-studio-tests

  release:
    name: Verify and publish GitHub Release
    needs: platform-install
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile

      - name: Verify tag and package version
        id: package
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = require('./packages/bundle/package.json')
          const expectedTag = `v${pkg.version}`
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match ${expectedTag}`)
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${pkg.version.includes('-')}\n`)
          NODE

      - run: pnpm check
      - run: pnpm test
        env:
          NOVEL_STUDIO_TEST_TMP: ${{ runner.temp }}/novel-studio-tests
      - run: pnpm build
      - run: pnpm pack:audit
      - run: npm install --global @deepseek-ai/dsh@0.1.0-rc.7
      - run: pnpm test:composition
        env:
          NOVEL_STUDIO_TEST_TMP: ${{ runner.temp }}/novel-studio-tests
      - run: git diff --check

      - name: Build release artifact and checksums
        run: pnpm release:pack

      - name: Verify clean release manifest and exact artifact
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const path = require('node:path')
          const pkg = require('./packages/bundle/package.json')
          const manifest = require('./dist/release-manifest.json')
          const assert = (condition, message) => { if (!condition) throw new Error(message) }
          const expectedArtifact = `${pkg.name.replace(/^@/, '').replaceAll('/', '-')}-${pkg.version}.tgz`
          assert(manifest.channel === 'github-release', 'Unexpected release channel')
          assert(manifest.version === pkg.version, 'Manifest version does not match package.json')
          assert(manifest.tag === process.env.GITHUB_REF_NAME, 'Manifest tag does not match pushed tag')
          assert(manifest.gitCommit === process.env.GITHUB_SHA, 'Manifest commit does not match tag commit')
          assert(manifest.workingTreeDirty === false, 'Formal release must come from a clean working tree')
          assert(manifest.artifact === expectedArtifact, 'Manifest artifact name is not the exact npm tarball')
          assert(manifest.compatibility?.deepSeekHarness === pkg.peerDependencies['@deepseek-ai/dsh-agent'], 'Harness compatibility drifted')
          assert(manifest.compatibility?.node === pkg.engines.node, 'Node compatibility drifted')
          const migrationSource = fs.readFileSync('./packages/bundle/src/storage-sqlite/migrations.ts', 'utf8')
          const schemaMatch = migrationSource.match(/EXPECTED_SCHEMA_VERSION\s*=\s*(\d+)/)
          assert(schemaMatch, 'Unable to read expected SQLite schema version')
          assert(manifest.compatibility?.sqliteSchema === Number(schemaMatch[1]), 'SQLite schema compatibility drifted')
          const dist = path.resolve('dist')
          const artifact = path.resolve(dist, manifest.artifact)
          const relative = path.relative(dist, artifact)
          assert(relative && !relative.startsWith('..') && !path.isAbsolute(relative), 'Artifact escaped dist')
          assert(fs.statSync(artifact).isFile(), 'Manifest artifact is missing from dist')
          const sha256 = crypto.createHash('sha256').update(fs.readFileSync(artifact)).digest('hex')
          assert(sha256 === manifest.sha256, 'Manifest SHA-256 does not match artifact')
          assert(fs.readFileSync('dist/SHA256SUMS', 'utf8').trim() === `${sha256}  ${manifest.artifact}`, 'SHA256SUMS does not match artifact')
          NODE

      - name: Install the exact release artifact
        shell: bash
        env:
          NOVEL_STUDIO_TEST_TMP: ${{ runner.temp }}/novel-studio-tests
        run: |
          artifact="$(find "$PWD/dist" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$artifact"
          NOVEL_STUDIO_INSTALL_SPEC="$artifact" pnpm test:composition

      - name: Attest exact plugin tarball
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tgz

      - name: Preserve verified release files
        uses: actions/upload-artifact@v7
        with:
          name: novel-studio-${{ steps.package.outputs.version }}
          path: |
            dist/*.tgz
            dist/SHA256SUMS
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.package.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tgz
            dist/SHA256SUMS
            dist/release-manifest.json
